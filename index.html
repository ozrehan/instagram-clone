<div id="app">
  <!-- ================= SIDEBAR ================= -->
  <nav class="sidebar">
    <div class="wordmark" id="wordmark"><span>Instagram</span></div>
    <div id="nav-list"></div>
    <div class="nav-spacer"></div>
    <button class="nav-item" id="more-btn"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg><span>More</span></button>
  </nav>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="feed">
        <div class="stories" id="stories"></div>
        <div id="posts"></div>
      </div>
      <aside class="rail">
        <div class="me-row" id="me-row"></div>
        <div class="suggest-head"><span>Suggested for you</span><button id="see-all-btn">See All</button></div>
        <div id="suggestions"></div>
        <div class="rail-foot">About &middot; Help &middot; Privacy &middot; Terms<br>&copy; 2026 Instagram clone</div>
      </aside>
    </section>
    <!-- REELS -->
    <section class="view" id="view-reels"><div class="reels-col" id="reels"></div></section>
    <!-- EXPLORE -->
    <section class="view" id="view-explore">
      <div class="chips" id="explore-chips"></div>
      <div class="explore-grid" id="explore-grid"></div>
    </section>
    <!-- PROFILE -->
    <section class="view" id="view-profile"><div class="profile-wrap" id="profile-wrap"></div></section>
    <!-- DIRECT MESSAGES -->
    <section class="view" id="view-dm"><div class="dm-wrap" id="dm-wrap">
      <div class="dm-threads" id="dm-threads"></div>
      <div class="dm-conv" id="dm-conv"></div>
    </div></section>
  </div>
</div>

<!-- ================= STORY VIEWER ================= -->
<div id="story-viewer">
  <div class="sv-card" id="sv-card">
    <div class="sv-top" id="sv-prog"></div>
    <div class="sv-user"><img id="sv-avatar" src="" alt=""><b id="sv-name"></b><span id="sv-time" style="opacity:.7"></span></div>
    <div class="sv-close" id="sv-close"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></div>
    <div class="sv-nav prev" id="sv-prev"></div>
    <div class="sv-nav next" id="sv-next"></div>
    <img class="sv-img" id="sv-img" src="" alt="story">
    <div class="sv-reply">
      <input id="sv-reply-input" type="text" placeholder="Reply..." maxlength="220" autocomplete="off">
      <button id="sv-like" aria-label="like story"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></button>
      <button id="sv-reply-send" aria-label="send reply"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg></button>
    </div>
  </div>
</div>

<!-- ================= NOTIFICATIONS PANEL ================= -->
<div id="notif-panel"></div>

<!-- ================= CREATE MODAL ================= -->
<div class="modal-overlay" id="create-modal"><div class="modal" id="create-box"></div></div>

<div id="toast"></div>
