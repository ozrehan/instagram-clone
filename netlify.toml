# Instagram clone — full-stack deploy config.
# The API lives in ONE Netlify Function. It is reachable at:
#   /.netlify/functions/api/<route>
# and (via the redirect below) at:
#   /api/<route>
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
